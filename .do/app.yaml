# Production spec: attaches the owner-provisioned DigitalOcean Managed PostgreSQL cluster.
# Prerequisites (cluster, database/user, public-schema grant, trusted sources, CA) and every
# deployment phase are in docs/APP_PLATFORM.md; generating or validating a spec creates nothing.
# Never create the app from this file directly: derive the worker-free foundation phase
# (bun dist/scripts/app-spec.js foundation .do/app.yaml OUT). The worker is added only at
# activation, from an untracked copy whose Discord token is filled and checked by the `full` phase.
name: tarubot
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED

# production: true attaches the existing cluster; App Platform neither creates nor resizes it.
# db_name/db_user are the dedicated application database and login, never defaultdb or doadmin.
# Bind the direct connection only: no connection pool (session advisory locks and the writer
# lease need a real session) and no DATABASE_PRIVATE_URL at launch.
databases:
  - name: db
    engine: PG
    version: "18"
    production: true
    cluster_name: tarubot-pg
    db_name: tarubot
    db_user: tarubot

# Only the bot consumes Discord gateway events. Keep a single instance and no autoscaling; the
# PostgreSQL writer lease also makes an overlapping replacement wait for the previous worker.
workers:
  - name: tarubot
    image: &bot-image
      registry_type: GHCR
      registry: deconfined
      repository: tarubot
      tag: &release "2.16.0"
      # For private packages, add registry_credentials in your untracked deployment copy.
    run_command: bun dist/src/main.js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    termination:
      grace_period_seconds: 30
    liveness_health_check:
      http_path: /health/live
      port: 3000
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: DISCORD_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_DISCORD_BOT_TOKEN
      # The production application's public ID; startup refuses a token of any other application.
      - key: DISCORD_APPLICATION_ID
        scope: RUN_TIME
        value: "965294750741692416"
      - key: NODESTONE_URL
        scope: RUN_TIME
        value: http://nodestone:8080
      - key: HEALTH_PORT
        scope: RUN_TIME
        value: "3000"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
      # The worker exists only from activation onward, so it starts effect-enabled and no second,
      # overlapping deployment is needed. Imported guilds still need their persisted activation flag.
      - key: ENABLE_EFFECTS
        scope: RUN_TIME
        value: "true"
      # Production never carries development scoping (and never TEST_PLAN_CHANNEL_ID).
      - key: TEST_GUILD_ID
        scope: RUN_TIME
        value: ""
      - key: PUBLIC_TEST_RESPONSES
        scope: RUN_TIME
        value: "false"
      # Maintenance tools run from this container's console resolve the production tool profile.
      - key: TARUBOT_ENVIRONMENT
        scope: RUN_TIME
        value: production

# An internal-only service: no http_port and no ingress rules expose Nodestone publicly.
services:
  - name: nodestone
    image:
      registry_type: GHCR
      registry: deconfined
      repository: tarubot-nodestone
      tag: *release
    run_command: bun dist/sidecar/server.js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    internal_ports: [8080]
    health_check:
      http_path: /health
      port: 8080
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    termination:
      grace_period_seconds: 30
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: PAGE_REGION
        scope: RUN_TIME
        value: na
      - key: LODESTONE_CONCURRENCY
        scope: RUN_TIME
        value: "2"
      - key: LODESTONE_START_MS
        scope: RUN_TIME
        value: "1000"
      - key: LODESTONE_TIMEOUT_MS
        scope: RUN_TIME
        value: "15000"
      - key: LODESTONE_BODY_BYTES
        scope: RUN_TIME
        value: "2000000"
      - key: NODESTONE_UPSTREAM_CHECK_SECONDS
        scope: RUN_TIME
        value: "3600"

# Migrate with exactly the bot image. No Discord token is needed by this job. The production
# profile makes migrate.js's tool guard require the managed direct port, the tarubot login and a CA.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    image: *bot-image
    run_command: bun dist/scripts/migrate.js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: TARUBOT_ENVIRONMENT
        scope: RUN_TIME
        value: production
