# Reviews ready pull requests to main with Claude's code-review plugin and posts inline findings.
name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    # Drafts wait for ready_for_review. Fork pull requests receive no secrets or OIDC token. Runs
    # started by bots are skipped: Dependabot runs receive no Actions secrets and the action rejects
    # other bot actors. A maintainer's push to a Dependabot branch is a User event, so the job runs,
    # but the plugin's first step usually declines automated pull requests such as Dependabot's.
    if: |
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.sender.type == 'User'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      # A newer push replaces an unfinished review of the same pull request.
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Reviews and inline comments are posted with the Claude GitHub App token, not GITHUB_TOKEN.
    permissions:
      contents: read # check out the pull request merge commit
      pull-requests: read # pull request metadata for the review (public data in this repository)
      id-token: write # exchanged for the short-lived Claude GitHub App token
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plugin reads the diff through `gh pr diff`, so it needs no local history.
          fetch-depth: 1
          # The action configures git with its own App token.
          persist-credentials: false
      - name: Review with the code-review plugin
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The plugin grants its own `gh` commands; allowing the inline-comment tool is what makes
          # the action start that MCP server.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Temporary diagnostics: silent reviews on large PRs give no reason in the default log.
          # This prints the full transcript, including tool results, into this public repository's
          # Actions log; the reviewer only reads public PR content and GitHub masks registered
          # secrets. Remove once the cause is known, and never enable it in claude.yml.
          show_full_output: true
