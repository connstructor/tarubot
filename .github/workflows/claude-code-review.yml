# Reviews ready pull requests to main with Claude's code-review plugin and posts inline findings.
name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    # Drafts wait for ready_for_review. Fork pull requests receive no secrets or OIDC token. Runs
    # started by bots are skipped, with one exception: the agent's GitHub App, tarubot-agent[bot]
    # (not the TaruBot app that opens /suggest issues), which opens the agent's pull requests. Its
    # opened, reopened and ready_for_review events start a review, so its pull requests need no
    # close and reopen. Its pushes (synchronize) stay skipped: pushes to the agent's branches
    # normally come from the maintainer's account, a User event that is reviewed as usual, and if
    # the agent ever commits through the app, each push would otherwise start a long review and
    # cancel the one running. The action admits that one bot through allowed_bots below, which must
    # name the same account; it rejects every other bot actor. Dependabot runs receive no Actions
    # secrets anyway. A maintainer's push to a Dependabot branch is a User event, so the job runs,
    # but the plugin's first step usually declines automated pull requests such as Dependabot's.
    if: |
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.sender.type == 'User'
          || (github.event.sender.login == 'tarubot-agent[bot]'
              && contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)))
    runs-on: ubuntu-24.04
    # A large change set (2.27.0's status posts, about 4,000 lines) ran past 30 minutes and was
    # cancelled unfinished (run 36194928467), so allow longer.
    timeout-minutes: 90
    concurrency:
      # A newer push replaces an unfinished review of the same pull request.
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Reviews and inline comments are posted with the Claude GitHub App token, not GITHUB_TOKEN.
    permissions:
      contents: read # check out the pull request merge commit
      pull-requests: read # pull request metadata for the review (public data in this repository)
      id-token: write # exchanged for the short-lived Claude GitHub App token
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plugin reads the diff through `gh pr diff`, so it needs no local history.
          fetch-depth: 1
          # The action configures git with its own App token.
          persist-credentials: false
      - name: Review with the code-review plugin
        id: review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        env:
          # Run every subagent in the foreground. Since Claude Code 2.1.198 a subagent starts in the
          # background unless Claude asks otherwise, and this action stops reading at the first
          # result, which then arrives while the agents still run: reviews ended green after about
          # 40 seconds with nothing posted (run 35948050785). With background tasks off, the only
          # result comes after the review finishes. The action should pass this step's environment
          # to Claude Code; if the check below still reports background subagents, set the variable
          # through the action's `settings` input instead. Drop it once the action waits for
          # background work (anthropics/claude-code-action#1499).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The agent's GitHub App, the one bot the job condition admits; keep the two in step, or
          # its runs fail with "Workflow initiated by non-human actor". The action checks no
          # repository permission for a [bot] actor, so this list is its only bot gate: name the
          # account alone, never '*'.
          allowed_bots: "tarubot-agent[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The tools the review may use without asking (2.30.1). No one can answer a prompt here,
          # so anything else is denied: the 2.15.0 review, with only the inline-comment tool listed,
          # recorded 55 Bash and 3 Write denials. The plugin grants its own `gh` commands, including
          # the comment it posts, but a rule here also covers its subagents. Allowing the
          # inline-comment tool is what makes the action start that MCP server. The rest only
          # reads: files, git history, the pull request and issues, and the readers a pipe needs.
          # Nothing here writes: no Write or Edit, no `gh api` (it can post), and no `find` rule
          # (Claude Code already runs its read-only forms, and Glob finds files). The deny rule
          # stops git's `--output=<file>`. An output redirect needs an Edit rule, so it stays
          # denied. `:*` also matches the bare command. The action reads every quoted value after
          # a flag, up to the next flag, as one rule. The next step prints the denial counts.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment"
            "Read" "Grep" "Glob"
            "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git status:*)"
            "Bash(git blame:*)"
            "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)" "Bash(gh pr list:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh search:*)"
            "Bash(ls:*)" "Bash(cat:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(wc:*)" "Bash(grep:*)"
            --disallowedTools
            "Bash(git *--output*)"
          # The full transcript, tool results included, prints only when debug logging is on (a
          # re-run with debug logging, or the ACTIONS_STEP_DEBUG secret or variable, which must
          # never be set repository-wide), because this repository's Actions logs are public. The
          # next step prints the counts that show whether the review finished. Never enable it in
          # claude.yml.
          show_full_output: ${{ runner.debug == '1' }}
      - name: Check that the review finished
        # Counts only, no transcript. A subagent started in the background, or one that never
        # reported back, means the action stopped reading before the review ended, so the job fails
        # instead of passing with nothing posted. Skipped when the action ran nothing, for example
        # on a pull request that changes this workflow.
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -o pipefail
          jq -r '
            (map(select(.type == "result")) | last) as $r
            | ($r.subagent_stats // {spawned: 0, started_in_background: 0, completed: 0, failed: 0}) as $s
            | if $r == null then "::error::The review produced no result message."
              else
                "Turns \($r.num_turns), \((($r.duration_ms // 0) / 1000) | floor) s, $\($r.total_cost_usd).",
                "Subagents: \($s | {spawned, requested, started_in_background, completed, failed} | tojson)",
                "Permission denials: \([$r.permission_denials[]?.tool_name] | group_by(.) | map("\(.[0]) x\(length)") | join(", ") | if . == "" then "none" else . end)",
                (if $s.started_in_background > 0 or ($s.completed + $s.failed) < $s.spawned
                 then "::error::Subagents ran in the background or never reported back; the review was cut short."
                 else empty end)
              end' "$EXECUTION_FILE" | tee "$RUNNER_TEMP/review-summary.txt"
          ! grep -q '^::error::' "$RUNNER_TEMP/review-summary.txt"
