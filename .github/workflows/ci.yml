# Pull requests validate source, persistence, and both image targets before they are merged.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Validated application SemVer
        value: ${{ jobs.checks.outputs.version }}

permissions:
  contents: read

concurrency:
  # Supersede stale PR checks, but never cancel another release's reusable verification job.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: tarubot_test
          POSTGRES_USER: tarubot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarubot -d tarubot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # This database and fixture contain synthetic test data only.
      TEST_DATABASE_URL: postgresql://tarubot:ci-only-password@localhost:5432/tarubot_test
      LEGACY_FIXTURE_PATH: .cache/ci/legacy.sql
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install the project Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Compile application and sidecar
        run: bun run build
      - name: Generate synthetic integration input
        run: bun run test:fixture
      - name: Run unit, contract, and PostgreSQL integration tests
        run: bun run test
      - name: Validate deployment and source-build Compose models
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.build.yml config --quiet
          # The production host's self-contained file, with placeholder values for its required settings.
          TARUBOT_IMAGE_TAG=0.0.0 DATABASE_URL=postgresql://tarubot:x@db.example:27520/tarubot \
            DATABASE_CA_CERT=x DISCORD_TOKEN=x \
            docker compose --env-file /dev/null -f docker-compose.production.yml config --quiet
      # The app is created from the worker-free foundation phase and updated through the
      # maintenance phase, so both derived files are validated alongside the committed template.
      - name: Derive worker-free App Platform phases
        run: |
          mkdir -p .cache/ci/app-platform
          for phase in foundation maintenance; do
            bun scripts/app-spec.ts "$phase" .do/app.yaml ".cache/ci/app-platform/$phase.yaml"
          done
      - name: Validate App Platform schemas without cloud credentials
        run: |
          for spec in .do/app.yaml .cache/ci/app-platform/foundation.yaml .cache/ci/app-platform/maintenance.yaml; do
            docker run --rm --network none -v "$PWD:/repo:ro" \
              digitalocean/doctl:1.169.0@sha256:f8a097dd95129ce4e5c751418d3ba4a67372c908728064af2b7fa7e3ee02b75f \
              apps spec validate "/repo/$spec" --schema-only > /dev/null
          done
      # Last, so dependency-update pull requests report every other step of this job before a
      # maintainer adds the required version increment; the job, the container builds that depend
      # on it, and CI result still fail without it.
      - name: Validate version and changelog
        id: version
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bun run ci:version

  images:
    name: Container build (${{ matrix.target }})
    # Main/tag publication builds its own multi-platform images after the reusable checks pass.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [tarubot, nodestone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  result:
    name: CI result
    if: always()
    needs: [checks, images]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable validation jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          test "$CHECKS" = success
          test "$IMAGES" = success || test "$IMAGES" = skipped
