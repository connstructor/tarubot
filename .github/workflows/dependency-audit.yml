# Report high and critical known vulnerabilities in every locked package, including transitive ones
# that Dependabot and the dependency graph cannot see for Bun lockfiles. Advisory: not a required
# merge check.
name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths: [package.json, bun.lock]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: bun audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the project Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Reads bun.lock directly against the npm advisory database; no install or secrets needed.
      - name: Audit locked packages
        run: bun audit --audit-level=high
