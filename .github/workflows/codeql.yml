# Analyze first-party application and workflow code for the main branch's required security gate.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "21 4 * * 1"

permissions:
  contents: read

concurrency:
  # Supersede stale PR analyses. Never cancel a running main or scheduled analysis; a newer main push
  # replaces only a pending one, so the latest main commit is always analyzed.
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # workflow-run metadata for the SARIF upload
      security-events: write # upload code scanning results that the main ruleset evaluates
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          # Both languages are interpreted, so extraction needs no build.
          build-mode: none
          # Security and code-quality query suites; see the config for what is analyzed.
          config-file: ./.github/codeql/config.yml
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
